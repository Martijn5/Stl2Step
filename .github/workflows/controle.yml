name: controle

on:
  push:
  pull_request:

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Afhankelijkheden
        run: pip install numpy pytest
      - name: Tests herkenning
        run: pytest -q tests
      - name: Python compileert
        run: python -m py_compile src/*.py
      - name: Shell-syntax
        run: bash -n stl2step.sh && bash -n install/install.sh
      - name: ShellCheck
        run: shellcheck -S error stl2step.sh install/install.sh
